name: Documentation
run-name: Deploy the redirect to the new documentation site

# This repository is retired; its Pages site only forwards to satfra.github.io/DiFfRG.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
