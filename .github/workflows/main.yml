name: CI

on: [push, pull_request]

jobs:
  preflight:
    name: Validate pre-flight checks
    runs-on: gha-diffrg
    container: ubuntu:24.04
    steps:
    - name: Install checkout prerequisites
      run: |
        apt-get update
        apt-get install -y ca-certificates git

    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y build-essential gfortran cmake git python3 \
          libgsl-dev libopenblas-dev libopenmpi-dev

    - name: CMake configure (pre-flight validation)
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/.local/share/DiFfRG -DGPU=OFF
