[project]
name = "diffrg-fv-diagnostics"
version = "0.1.0"
description = "Standalone diagnostics and plotting tools for DiFfRG finite-volume runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py",
  "matplotlib",
  "numpy",
]

[project.scripts]
diffrg-fv-dashboard = "diffrg_fv_diagnostics.dashboard:main"

[dependency-groups]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
